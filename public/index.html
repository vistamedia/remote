<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winx Remote">
<meta name="theme-color" content="#180B2E">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Winx Remote</title>
<style>
  /* Police embarquée, pas servie par un CDN : le Mac n'a aucune raison
     d'avoir Internet pour que la télécommande fonctionne sur le LAN. */
  @font-face{
    font-family:'Outfit';
    src:url('fonts/outfit-variable.woff2') format('woff2-variations');
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --indigo-900:#0B0518;
    --indigo-850:#0E0620;
    --indigo-800:#150826;
    --indigo-700:#1B0E30;
    --indigo-600:#2C1A46;
    --indigo-500:#3A2350;
    --fuchsia:#FF2D95;
    --fuchsia-dk:#D8177A;
    --violet:#8B36E8;
    --gold:#FFCF5C;
    --mint:#5CE6B5;
    --white:#FFF4FA;
    --lilac-300:#D6C9E6;
    --lilac-400:#C9B6DE;
    --mauve-500:#9C86B8;
    --mauve-700:#6E5A8A;

    --fill:38%;
    --progress:0%;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%;background:var(--indigo-850);overscroll-behavior:none}

  body{
    font-family:'Outfit',ui-rounded,-apple-system,system-ui,sans-serif;
    color:var(--white);
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }

  #app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* ---------- barre d'état ---------- */

  #status{
    height:54px;flex:none;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 30px;
  }

  /* Sélecteur de grandeur réglée par le grand curseur. Contrairement à
     #sources, qui n'est qu'un indicateur, celui-ci est un vrai choix : d'où
     une apparence délibérément distincte, en icônes seules, pour ne pas
     donner à deux composants la même forme et deux comportements. */
  #modes{
    display:flex;gap:4px;background:var(--indigo-700);
    padding:4px;border-radius:999px;
  }
  #modes button{
    width:46px;height:38px;display:grid;place-items:center;
    border-radius:999px;color:var(--mauve-500);
    transition:background .2s ease,color .2s ease;
  }
  #modes button svg{width:19px;height:19px}
  #modes button.on{background:var(--fuchsia);color:var(--indigo-800)}
  #modes button.on[data-mode="brightness"]{background:var(--gold)}
  /* Masqué quand DisplayServices ne répond pas : sans luminosité pilotable,
     le sélecteur n'aurait qu'une seule option. */
  #modes.hidden{display:none}
  #link{
    display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--mint);
    transition:color .3s ease;
  }
  #link::before{
    content:"";width:7px;height:7px;border-radius:50%;
    background:currentColor;
  }
  #link.off{color:var(--mauve-700)}
  #link.screen-off{color:var(--gold)}

  /* ---------- en-tête ---------- */

  header{
    flex:none;padding:6px 24px 14px;
    display:flex;align-items:center;gap:12px;
  }
  header svg{flex:none}
  .titles{display:flex;flex-direction:column;flex:1;min-width:0}
  .titles b{font-size:14px;font-weight:600;color:var(--white)}
  .titles span{
    font-size:10px;color:var(--mauve-500);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* Indicateur de source, non cliquable : macOS n'expose qu'une session de
     lecture à la fois et ne permet pas d'en choisir une. On nomme celle qui
     joue, on ne la sélectionne pas. */
  #sources{
    display:flex;gap:6px;background:var(--indigo-700);
    padding:4px;border-radius:999px;flex:none;
  }
  #sources span{
    font-size:11px;font-weight:600;padding:8px 14px;border-radius:999px;
    color:var(--lilac-400);transition:background .2s ease,color .2s ease;
  }
  #sources span.on{background:var(--fuchsia);color:var(--indigo-800)}

  /* ---------- zone de volume ---------- */

  #stage{
    flex:1;position:relative;overflow:hidden;
    touch-action:none;
  }
  #fill{
    position:absolute;left:0;right:0;bottom:0;
    height:var(--fill);
    background:linear-gradient(var(--fuchsia),var(--violet));
    transition:height .12s ease-out;
  }
  /* Le mode luminosité vire à l'or, déjà la couleur de l'écran dans la
     palette. Les deux modes restent discernables du coin de l'œil, sans
     avoir à lire le libellé. */
  #stage.brightness #fill{background:linear-gradient(var(--gold),var(--fuchsia))}
  #stage .layer{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:18px 0 22px;
  }
  .step{
    width:56px;height:56px;display:grid;place-items:center;
    border-radius:50%;font-size:26px;font-weight:300;
    color:var(--lilac-300);
  }
  #up:active{background:rgba(255,255,255,.12)}
  #down{color:#F4E9FA}
  #down:active{background:rgba(0,0,0,.16)}
  /* Le remplissage doré est clair, là où le fuchsia et le violet sont
     sombres : posés dessus, les signes + et − s'effacent. Un disque
     translucide les détache, et reste invisible sur le fond indigo quand la
     luminosité est basse — les deux fonds sont donc couverts sans changer de
     couleur en cours de glissement. */
  #stage.brightness .step{background:rgba(14,6,32,.3);color:var(--white)}
  .readout{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    pointer-events:none;
  }
  .readout b{
    font-size:104px;font-weight:800;line-height:.92;letter-spacing:-.04em;
    color:var(--white);font-variant-numeric:tabular-nums;
    transition:color .3s ease;
  }
  .readout b.muted{color:var(--mauve-700)}
  .readout span{
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--lilac-400);
  }

  /* ---------- bloc lecture ---------- */

  footer{
    flex:none;background:var(--indigo-900);
    padding:20px 26px calc(26px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:16px;
  }
  .meta{display:flex;flex-direction:column;gap:8px}

  #seek{height:24px;display:flex;align-items:center}
  #seek .track{
    height:5px;width:100%;border-radius:3px;
    background:var(--indigo-600);position:relative;
  }
  #seek .done{
    position:absolute;top:0;bottom:0;left:0;width:var(--progress);
    border-radius:3px;background:var(--fuchsia);
  }
  #seek .knob{
    position:absolute;top:-4px;left:var(--progress);
    width:13px;height:13px;margin-left:-6px;border-radius:50%;
    background:var(--white);
  }
  .times{display:flex;justify-content:space-between;font-size:10px;color:var(--mauve-500)}
  .naming{display:flex;flex-direction:column;gap:2px}
  .naming b{font-size:14px;font-weight:600;color:var(--white)}
  .naming span{
    font-size:10px;color:var(--mauve-500);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* Masqué tant que la source ne publie ni durée ni position : une barre de
     progression qui n'avance pas vaut moins que pas de barre du tout. */
  .meta.no-progress #seek,
  .meta.no-progress .times{display:none}

  #transport{display:flex;align-items:center;justify-content:space-between}
  .key{
    width:52px;height:52px;display:grid;place-items:center;
    border-radius:50%;background:var(--indigo-700);
    font-size:11px;color:var(--lilac-300);
  }
  .key:active{background:var(--indigo-600)}
  .key svg{width:20px;height:20px;fill:#EDE4F7}
  #play{
    width:76px;height:76px;display:grid;place-items:center;
    border-radius:50%;background:var(--fuchsia);
  }
  #play:active{background:var(--fuchsia-dk)}
  #play svg{width:26px;height:26px;fill:var(--indigo-800)}

  .bottom{display:flex;align-items:center;gap:12px}
  #mute{
    width:52px;height:52px;flex:none;display:grid;place-items:center;
    border-radius:50%;background:var(--indigo-700);
  }
  #mute svg{width:20px;height:20px;fill:#EDE4F7}
  #mute.on{background:var(--gold)}
  #mute.on svg{fill:var(--indigo-800)}
  #screen{
    flex:1;min-width:0;height:52px;display:grid;place-items:center;
    border-radius:26px;border:1px solid var(--indigo-500);
    color:var(--mauve-500);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    text-align:center;line-height:1.25;
  }
  #screen.off{border-color:var(--gold);color:var(--gold)}

  /* Même forme que la sourdine, en miroir de l'autre côté du bouton
     d'écran. Doré quand le plein écran est actif, comme la sourdine et
     l'écran éteint : dans cette palette, l'or signale ce qui est en cours. */
  #fullscreen{
    width:52px;height:52px;flex:none;display:grid;place-items:center;
    border-radius:50%;background:var(--indigo-700);
  }
  #fullscreen svg{width:20px;height:20px;fill:#EDE4F7}
  #fullscreen.on{background:var(--gold)}
  #fullscreen.on svg{fill:var(--indigo-800)}
  /* Masqué dès qu'aucune application pilotable n'est au premier plan. */
  #fullscreen.hidden{display:none}

  /* ---------- voile écran éteint ---------- */

  #veil{
    position:absolute;inset:0;background:rgba(6,3,14,.94);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:0 32px;
  }
  #veil.shown{display:flex}
  #veil .over{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8B6FA8}
  #veil .head{font-size:22px;font-weight:600;color:var(--white)}
  #veil .note{font-size:12px;color:#8B6FA8}

  /* ---------- écran de lancement ---------- */

  /* iOS n'affiche un vrai splash natif que si on lui fournit une image par
     résolution d'appareil. Celui-ci est dessiné par la page : il couvre
     l'interface le temps que le premier état arrive, puis s'efface. */
  #splash{
    position:fixed;inset:0;z-index:10;
    background:var(--indigo-800);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;overflow:hidden;
    transition:opacity .45s ease;
  }
  #splash.gone{opacity:0;pointer-events:none}
  #splash .halo{position:absolute;border-radius:50%}
  #splash .halo.big{width:420px;height:420px;background:#2A0F4A}
  #splash .halo.small{width:260px;height:260px;background:#3A1560}
  #splash svg,#splash .wordmark{position:relative}
  #splash .wordmark{
    display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  }
  #splash .wordmark b{
    font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--white);
  }
  #splash .wordmark span{
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C08CFF;
  }

  button{
    -webkit-appearance:none;appearance:none;border:0;
    background:transparent;color:inherit;font:inherit;
    cursor:pointer;
  }
  button:focus-visible{outline:2px solid var(--fuchsia);outline-offset:-3px}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="app">

  <div id="status">
    <div id="modes" class="hidden">
      <button data-mode="volume" class="on" aria-label="Régler le volume" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z"/></svg>
      </button>
      <button data-mode="brightness" aria-label="Régler la luminosité" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
    </div>
    <span id="link">connecté</span>
  </div>

  <header>
    <svg viewBox="0 0 512 512" width="34" height="34" aria-hidden="true">
      <g stroke="#0E0620" stroke-width="20">
        <polygon points="216,296 152,112 56,64 38,186 136,266" fill="#FFB3D9"/>
        <polygon points="216,296 152,112 114,128 164,264" fill="#FF2D95"/>
        <polygon points="216,304 124,302 46,354 114,420 198,344" fill="#8B36E8"/>
        <polygon points="296,296 360,112 456,64 474,186 376,266" fill="#FFB3D9"/>
        <polygon points="296,296 360,112 398,128 348,264" fill="#FF2D95"/>
        <polygon points="296,304 388,302 466,354 398,420 314,344" fill="#8B36E8"/>
      </g>
      <polygon points="220,170 220,346 356,258" fill="#FFF4FA"/>
    </svg>
    <div class="titles">
      <b>Winx Remote</b>
      <span id="device">…</span>
    </div>
    <div id="sources" aria-label="Source en cours de lecture">
      <span data-source="netflix">Netflix</span>
      <span data-source="prime">Prime Video</span>
    </div>
  </header>

  <div id="stage">
    <div id="fill"></div>
    <div class="layer">
      <button id="up" class="step" aria-label="Monter le volume">+</button>
      <div class="readout">
        <b data-num>38</b>
        <span data-cap>Volume</span>
      </div>
      <button id="down" class="step" aria-label="Baisser le volume">&minus;</button>
    </div>
  </div>

  <footer>
    <div class="meta no-progress">
      <div id="seek">
        <div class="track">
          <div class="done"></div>
          <div class="knob"></div>
        </div>
      </div>
      <div class="times">
        <span id="elapsed">0:00</span><span id="remain">-0:00</span>
      </div>
      <div class="naming">
        <b id="title">Rien en lecture</b>
        <span id="subtitle">Aucune source détectée</span>
      </div>
    </div>

    <div id="transport">
      <button id="prev" class="key" aria-label="Précédent">
        <svg viewBox="0 0 24 24"><path d="M7 5h2v14H7zM20 5v14L9.5 12z"/></svg>
      </button>
      <button id="back10" class="key" aria-label="Reculer de dix secondes">&minus;10</button>
      <button id="play" aria-label="Lecture ou pause">
        <svg viewBox="0 0 24 24"><polygon points="7,4 7,20 20,12"/></svg>
      </button>
      <button id="fwd10" class="key" aria-label="Avancer de dix secondes">+10</button>
      <button id="next" class="key" aria-label="Suivant">
        <svg viewBox="0 0 24 24"><path d="M15 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
      </button>
    </div>

    <div class="bottom">
      <button id="mute" aria-label="Couper le son">
        <svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z"/></svg>
      </button>
      <button id="screen">Éteindre l’écran du Mac</button>
      <button id="fullscreen" class="hidden" aria-label="Plein écran" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"/>
        </svg>
      </button>
    </div>
  </footer>

  <div id="veil">
    <span class="over">écran du mac éteint</span>
    <span class="head">Toucher pour rallumer</span>
    <span class="note">La lecture continue</span>
  </div>
</div>

<div id="splash">
  <div class="halo big"></div>
  <div class="halo small"></div>
  <svg viewBox="0 0 512 512" width="150" height="150" aria-hidden="true">
    <g stroke="#3A1560" stroke-width="10">
      <polygon points="216,296 152,112 56,64 38,186 136,266" fill="#FFB3D9"/>
      <polygon points="216,296 152,112 114,128 164,264" fill="#FF2D95"/>
      <polygon points="216,304 124,302 46,354 114,420 198,344" fill="#8B36E8"/>
      <polygon points="296,296 360,112 456,64 474,186 376,266" fill="#FFB3D9"/>
      <polygon points="296,296 360,112 398,128 348,264" fill="#FF2D95"/>
      <polygon points="296,304 388,302 466,354 398,420 314,344" fill="#8B36E8"/>
    </g>
    <polygon points="220,170 220,346 356,258" fill="#FFF4FA"/>
  </svg>
  <div class="wordmark">
    <b>Winx Remote</b>
    <span>la télécommande magique</span>
  </div>
</div>

<script>
"use strict";

const TOKEN = new URLSearchParams(location.search).get("t")
            || localStorage.getItem("remote_token") || "";
if (TOKEN) localStorage.setItem("remote_token", TOKEN);

const GUARD = 600;   // le serveur met ~190 ms à répondre : on ignore les échos
const STEP  = 5;     // pas des boutons + et −, validé à l'usage
const DRAG  = 3;     // au-delà, l'appui devient un glissement

const app      = document.getElementById("app");
const stage    = document.getElementById("stage");
const link     = document.getElementById("link");
const veil     = document.getElementById("veil");
const meta     = document.querySelector(".meta");
const muteBtn  = document.getElementById("mute");
const screenBtn= document.getElementById("screen");
const playIcon = document.querySelector("#play svg");
const modes    = document.getElementById("modes");
const upBtn    = document.getElementById("up");
const downBtn  = document.getElementById("down");
const fsBtn    = document.getElementById("fullscreen");
const nums     = document.querySelectorAll("[data-num]");
const caps     = document.querySelectorAll("[data-cap]");

/* Grandeur réglée par le grand curseur : « volume » ou « brightness ». Le
   geste, les boutons + et − et le throttle sont partagés, seule la
   destination change. */
let mode = "volume";

let volume = 38, muted = false, playing = false;
let brightness = 50, brightnessOk = false;
/* « active » reste nul sur les applications qui ne publient pas leur plein
   écran — un navigateur, dont la vidéo est en plein écran sans que la
   fenêtre le soit. Le bouton reste alors neutre plutôt que de trancher. */
let fullscreenOk = false, fullscreenActive = null;
let duration = null, elapsed = null, sourceName = null;
let title = null, artist = null;
let screenOff = false;
let guardUntil = 0;

/* ---------- rendu ---------- */

function pad(n) { return String(n).padStart(2, "0"); }

function fmt(sec) {
  const s = Math.max(0, Math.round(sec));
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? h + ":" + pad(m % 60) : String(m)) + ":" + pad(s % 60);
}

function render() {
  /* Sans luminosité pilotable, le sélecteur disparaît et le curseur revient
     au volume : on n'affiche jamais une commande qui ne peut pas aboutir. */
  if (!brightnessOk && mode !== "volume") mode = "volume";
  modes.classList.toggle("hidden", !brightnessOk);
  modes.querySelectorAll("button").forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });

  const isVolume = mode === "volume";
  stage.classList.toggle("brightness", !isVolume);

  const shown = isVolume ? (muted ? 0 : Math.round(volume)) : Math.round(brightness);
  document.documentElement.style.setProperty("--fill", shown + "%");
  nums.forEach(n => { n.textContent = shown; n.classList.toggle("muted", isVolume && muted); });
  caps.forEach(c => c.textContent = isVolume ? (muted ? "Sourdine" : "Volume") : "Luminosité");
  upBtn.setAttribute("aria-label", isVolume ? "Monter le volume" : "Augmenter la luminosité");
  downBtn.setAttribute("aria-label", isVolume ? "Baisser le volume" : "Réduire la luminosité");
  muteBtn.classList.toggle("on", muted);

  playIcon.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="7,4 7,20 20,12"/>';

  document.getElementById("title").textContent = title || "Rien en lecture";

  const nomSource = sourceName === "netflix" ? "Netflix"
                  : sourceName === "prime" ? "Prime Video" : null;
  const parts = [];
  /* Netflix ne publie que son propre nom comme titre : le répéter juste en
     dessous n'apprendrait rien. */
  if (nomSource && (!title || title.toLowerCase().indexOf(nomSource.toLowerCase()) === -1)) {
    parts.push(nomSource);
  }
  if (artist) parts.push(artist);

  const sub = document.getElementById("subtitle");
  sub.textContent = parts.length ? parts.join(" · ") : (title ? "" : "Aucune source détectée");
  sub.style.display = sub.textContent ? "" : "none";

  document.querySelectorAll("#sources span").forEach(el => {
    el.classList.toggle("on", el.dataset.source === sourceName);
  });

  const hasProgress = duration !== null && elapsed !== null;
  meta.classList.toggle("no-progress", !hasProgress);
  if (hasProgress) {
    const ratio = Math.max(0, Math.min(1, elapsed / duration));
    document.documentElement.style.setProperty("--progress", (ratio * 100).toFixed(2) + "%");
    document.getElementById("elapsed").textContent = fmt(elapsed);
    document.getElementById("remain").textContent = "-" + fmt(duration - elapsed);
  }

  fsBtn.classList.toggle("hidden", !fullscreenOk);
  fsBtn.classList.toggle("on", fullscreenActive === true);
  fsBtn.setAttribute("aria-pressed", String(fullscreenActive === true));
  fsBtn.setAttribute("aria-label",
    fullscreenActive === true ? "Quitter le plein écran" : "Plein écran");

  veil.classList.toggle("shown", screenOff);
  screenBtn.classList.toggle("off", screenOff);
  screenBtn.textContent = screenOff ? "Rallumer l’écran du Mac" : "Éteindre l’écran du Mac";
  link.classList.toggle("screen-off", screenOff && !link.classList.contains("off"));
  link.textContent = link.classList.contains("off") ? "hors ligne"
                   : (screenOff ? "écran éteint" : "connecté");
}

function setVolume(v) {
  volume = Math.min(100, Math.max(0, v));
  /* macOS lève le mode muet dès qu'on écrit le volume : on l'anticipe à
     l'affichage plutôt que d'envoyer une commande de plus. */
  if (muted && volume > 0) muted = false;
  render();
  queue();
}

function setBrightness(v) {
  brightness = Math.min(100, Math.max(0, v));
  render();
  queue();
}

/* Applique une valeur absolue à la grandeur en cours de réglage. */
function setCurrent(v) {
  if (mode === "volume") setVolume(v);
  else setBrightness(v);
}

/* ---------- réseau ---------- */

async function send(path, body) {
  guardUntil = Date.now() + GUARD;
  try {
    const r = await fetch("/api" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Token": TOKEN },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(r.status);
    apply(await r.json());
    online(true);
  } catch { online(false); }
}

function online(ok) {
  link.classList.toggle("off", !ok);
  render();
}

function apply(s) {
  if (Date.now() < guardUntil) return;
  if (Math.abs(s.volume - volume) > 3) volume = s.volume;  // tolérance d'arrondi macOS
  muted = s.muted;

  brightnessOk = s.brightnessControllable !== false && typeof s.brightness === "number";
  /* Tolérance de 1 là où le volume en tolère 3 : la relecture de la
     luminosité est exacte, et les crans du clavier du Mac valent environ six
     points. Les élargir masquerait les changements venus de la machine. */
  if (typeof s.brightness === "number" && Math.abs(s.brightness - brightness) > 1) {
    brightness = s.brightness;
  }

  const f = s.fullscreen || {};
  fullscreenOk = Boolean(f.available);
  fullscreenActive = typeof f.active === "boolean" ? f.active : null;
  const m = s.media || {};
  playing = Boolean(m.playing);
  title = m.title || null;
  artist = m.artist || null;
  sourceName = m.source || null;
  duration = typeof m.duration === "number" ? m.duration : null;
  if (typeof m.elapsed === "number") elapsed = m.elapsed;
  else if (duration === null) elapsed = null;
  render();
}

function listen() {
  const es = new EventSource("/api/events?t=" + encodeURIComponent(TOKEN));
  es.addEventListener("state", e => { apply(JSON.parse(e.data)); online(true); });
  es.onopen  = () => online(true);
  es.onerror = () => online(false);
}

async function refresh() {
  try {
    const r = await fetch("/api/state", { headers: { "X-Token": TOKEN } });
    if (!r.ok) throw new Error(r.status);
    apply(await r.json());
    online(true);
  } catch { online(false); }
}

/* Throttle 80 ms, envoi final garanti. Le serveur ne garde que la dernière
   valeur : on remplace, on n'empile pas. Le mode est retenu avec la valeur,
   faute de quoi une bascule pendant le throttle enverrait la luminosité sur
   la route du volume. */
let pending = null, pendingMode = null, sendTimer = null;
function queue() {
  pendingMode = mode;
  pending = Math.round(mode === "volume" ? volume : brightness);
  if (sendTimer) return;
  sendTimer = setTimeout(() => { sendTimer = null; flush(); }, 80);
}
function flush() {
  if (pending === null) return;
  send(pendingMode === "volume" ? "/volume" : "/brightness", { value: pending });
  pending = null;
  pendingMode = null;
}

/* La position n'est republiée qu'aux changements d'état. Entre deux, on la
   fait avancer localement pour que la barre ne reste pas figée. */
setInterval(() => {
  if (!playing || duration === null || elapsed === null) return;
  if (Date.now() < guardUntil) return;
  elapsed = Math.min(duration, elapsed + 1);
  render();
}, 1000);

/* ---------- volume au glissement ---------- */

let dragging = false, startY = 0, moved = false;

function valueAt(clientY) {
  const r = stage.getBoundingClientRect();
  return Math.round((1 - (clientY - r.top) / r.height) * 100);
}

stage.addEventListener("pointerdown", e => {
  if (screenOff) return;
  /* La capture garde le glissement vivant si le doigt sort de la zone. Elle
     échoue sur certains pointeurs sans que ce soit bloquant. */
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  dragging = true; startY = e.clientY; moved = false;
});

stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  if (!moved && Math.abs(e.clientY - startY) <= DRAG) return;
  moved = true;
  setCurrent(valueAt(e.clientY));
});

function endDrag() { if (dragging) { dragging = false; flush(); } }
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* ---------- commandes ---------- */

function stepBy(delta) {
  setCurrent(Math.round(mode === "volume" ? volume : brightness) + delta);
}
upBtn.onclick   = () => stepBy(STEP);
downBtn.onclick = () => stepBy(-STEP);

modes.querySelectorAll("button").forEach(b => {
  b.onclick = () => {
    if (b.dataset.mode === mode) return;
    /* Une valeur peut attendre le throttle : elle appartient à la grandeur
       qu'on quitte et doit partir avant la bascule. */
    flush();
    mode = b.dataset.mode;
    render();
  };
});

muteBtn.onclick = () => {
  muted = !muted;
  render();
  send("/mute", { muted });
};

document.getElementById("play").onclick = () => {
  playing = !playing;
  render();
  send("/media", { action: "playpause" });
};

document.getElementById("prev").onclick = () => {
  /* Comme sur un lecteur : on revient au début avant de changer de piste. */
  if (duration !== null && elapsed !== null && elapsed > 8) return seekTo(0);
  send("/media", { action: "previous" });
};
document.getElementById("next").onclick = () => send("/media", { action: "next" });

document.getElementById("back10").onclick = () => seekTo((elapsed || 0) - 10);
document.getElementById("fwd10").onclick  = () => seekTo((elapsed || 0) + 10);

function seekTo(position) {
  if (duration === null) return;
  elapsed = Math.max(0, Math.min(duration, Math.round(position)));
  render();
  send("/media", { action: "seek", position: elapsed });
}

document.getElementById("seek").addEventListener("pointerdown", e => {
  if (duration === null) return;
  const r = e.currentTarget.getBoundingClientRect();
  seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * duration);
});

/* Le plein écran ne s'affiche pas de façon optimiste. Le serveur relit
   l'application après avoir écrit — VLC accepte parfois sans appliquer — et
   sa réponse est donc plus sûre qu'une anticipation. On l'applique sans
   passer par la fenêtre de garde, qui n'existe que pour protéger
   l'affichage optimiste du volume. */
fsBtn.onclick = async () => {
  try {
    const r = await fetch("/api/fullscreen", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Token": TOKEN },
      body: JSON.stringify({ toggle: true })
    });
    /* 503 : plus aucune application pilotable au premier plan. Le serveur va
       bien, c'est le bouton qui n'a plus lieu d'être. */
    if (r.status === 503) {
      fullscreenOk = false;
      render();
      return online(true);
    }
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    const f = s.fullscreen || {};
    fullscreenOk = Boolean(f.available);
    fullscreenActive = typeof f.active === "boolean" ? f.active : null;
    render();
    online(true);
  } catch { online(false); }
};

function toggleScreen() {
  screenOff = !screenOff;
  render();
  send("/display", { action: screenOff ? "sleep" : "wake" });
}
screenBtn.onclick = toggleScreen;
veil.onclick = toggleScreen;

/* Safari gèle la page en arrière-plan : on resynchronise au retour. */
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
document.addEventListener("gesturestart", e => e.preventDefault());

/* Le nom du Mac vient de l'URL : c'est déjà lui qu'on a saisi pour venir. */
document.getElementById("device").textContent = location.hostname.replace(/\.local$/, "");

/* L'écran de lancement s'efface dès que le premier état est là, mais pas
   avant un court temps de pose : sans lui, il disparaîtrait en un clin d'œil
   sur le réseau local et on ne le verrait jamais. */
const splash = document.getElementById("splash");
const splashDepuis = Date.now();
let splashParti = false;

function fermerSplash() {
  if (splashParti) return;
  splashParti = true;
  const reste = Math.max(0, 900 - (Date.now() - splashDepuis));
  setTimeout(() => {
    splash.classList.add("gone");
    setTimeout(() => splash.remove(), 600);
  }, reste);
}

render();
refresh().finally(fermerSplash);
listen();

/* Filet de sécurité : si le serveur ne répond pas du tout, l'écran de
   lancement ne doit pas rester en travers de l'interface. */
setTimeout(fermerSplash, 4000);
</script>
</body>
</html>
